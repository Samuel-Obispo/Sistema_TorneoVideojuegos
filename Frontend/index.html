<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso · TorneoGamer</title>
  <link rel="stylesheet" href="css/global.css" />
  <style>
    .auth-wrapper {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
    }
    .tabs-auth {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--border, #333);
      padding-bottom: 0.5rem;
    }
    .tab-btn {
      flex: 1;
      padding: 0.6rem;
      background: none;
      border: none;
      color: var(--text-muted, #888);
      font-weight: 600;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      color: var(--text, #fff);
      border-bottom-color: var(--primary, #6366f1);
    }
    .auth-form {
      display: none;
    }
    .auth-form.active {
      display: block;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="index.html" class="brand">
        <span class="brand-mark">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="4"/><line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/><line x1="15" y1="13" x2="15.01" y2="13"/><line x1="18" y1="11" x2="18.01" y2="11"/></svg>
        </span>
        <span class="brand-text">Torneo<em>Game</em></span>
      </a>
    </div>
  </header>

  <main class="container auth-wrapper">
    <div class="card auth-card">
      
      <!-- Pestañas para cambiar entre Login y Registro -->
      <div class="tabs-auth">
        <button type="button" class="tab-btn active" id="tabLogin">Iniciar Sesión</button>
        <button type="button" class="tab-btn" id="tabRegister">Registrarse</button>
      </div>

      <!-- Formulario de Login -->
      <form id="formLogin" class="auth-form active">
        <div class="form-row">
          <label for="loginUsuario">Usuario o Correo</label>
          <input type="text" id="loginUsuario" required placeholder="Ej. admin" autocomplete="username" />
        </div>
        <div class="form-row">
          <label for="loginPassword">Contraseña</label>
          <input type="password" id="loginPassword" required placeholder="••••••••" autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
        <div class="mensaje" id="msgLogin"></div>
      </form>

      <!-- Formulario de Registro -->
      <form id="formRegister" class="auth-form">
        <div class="form-row">
          <label for="regUsuario">Nombre de Usuario</label>
          <input type="text" id="regUsuario" required placeholder="Ej. shadow_gamer" maxlength="50" autocomplete="username" />
        </div>
        <div class="form-row">
          <label for="regCorreo">Correo Electrónico</label>
          <input type="email" id="regCorreo" required placeholder="ejemplo@correo.com" maxlength="100" autocomplete="email" />
        </div>
        <div class="form-row">
          <label for="regPassword">Contraseña</label>
          <input type="password" id="regPassword" required placeholder="••••••••" minlength="6" autocomplete="new-password" />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Crear Cuenta</button>
        <div class="mensaje" id="msgRegister"></div>
      </form>

    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
