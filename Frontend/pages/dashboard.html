<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Principal · TorneoGamer</title>
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/estadisticas.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="dashboard.html" class="brand">
        <span class="brand-mark">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="4"/><line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/><line x1="15" y1="13" x2="15.01" y2="13"/><line x1="18" y1="11" x2="18.01" y2="11"/></svg>
        </span>
        <span class="brand-text">Torneo<em>Game</em></span>
      </a>
      <nav class="mainnav">
        <a href="dashboard.html" class="active">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Panel
        </a>
        <a href="jugadores.html">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Jugadores
        </a>
        <a href="videojuegos.html">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="4"/><line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/><line x1="15" y1="13" x2="15.01" y2="13"/><line x1="18" y1="11" x2="18.01" y2="11"/></svg>
          Videojuegos
        </a>
        <a href="puntuaciones.html">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
          Puntuaciones
        </a>
        <a href="ranking.html">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
          Ranking
        </a>
        <button id="btnLogout" class="btn-logout" style="background:none; border:none; color:var(--text-muted); cursor:pointer; padding:0.5rem 1rem; font-size:0.9rem;">
          Salir
        </button>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="page-head">
      <div>
        <span class="eyebrow">Panel de control</span>
        <h1 class="page-title">Resumen <em>general</em></h1>
        <p class="page-subtitle">Métricas principales de rendimiento y actividad del torneo.</p>
      </div>
    </div>

    <section class="stats-grid">
      <div class="stat-card">
        <span class="stat-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        </span>
        <span class="stat-label">Total jugadores</span>
        <span class="stat-value" id="totalJugadores">—</span>
      </div>
      <div class="stat-card">
        <span class="stat-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="4"/><line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/><line x1="15" y1="13" x2="15.01" y2="13"/><line x1="18" y1="11" x2="18.01" y2="11"/></svg>
        </span>
        <span class="stat-label">Total videojuegos</span>
        <span class="stat-value" id="totalJuegos">—</span>
      </div>
      <div class="stat-card">
        <span class="stat-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
        </span>
        <span class="stat-label">Total puntuaciones</span>
        <span class="stat-value" id="totalPuntuaciones">—</span>
      </div>
      <div class="stat-card">
        <span class="stat-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        </span>
        <span class="stat-label">Puntuación promedio</span>
        <span class="stat-value" id="promedio">—</span>
      </div>
    </section>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/nav.js"></script>
  <script src="../js/estadisticas.js"></script>
</body>
</html>
